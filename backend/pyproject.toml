[project]
name = "homerun-backend"
version = "0.1.0"
description = "Homerun - explainable multi-agent Singapore property discovery backend (IBM Z Datathon 2026)"
requires-python = ">=3.11"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
